<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McCulloch-Pitts Neuron Lab</title>
    
    <!-- Fonts: Poppins (Headers) & Inter (Body) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS (Used mainly for grid system, overridden by custom themes) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Icons: Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Core Architecture CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"> <!-- Keep legacy for specific overrides -->
    
    <!-- GSAP for advanced animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body class="bg-main text-primary fade-up">
    
    <!-- Premium Navbar -->
    <header class="app-header p-3 mb-4 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <div class="logo-icon d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; background: rgba(6, 182, 212, 0.1); border-radius: 12px; border: 1px solid rgba(6, 182, 212, 0.3);">
                    <i class="fas fa-brain text-gradient fs-4"></i>
                </div>
                <div>
                    <h1 class="h5 mb-0 fw-bold" style="font-family: 'Poppins', sans-serif;">MP Neuron Lab</h1>
                    <span class="badge" style="background: rgba(59, 130, 246, 0.2); color: #3B82F6; border: 1px solid rgba(59, 130, 246, 0.3);">Educational Platform</span>
                </div>
            </div>

            <!-- Navbar Links -->
            <nav class="d-none d-lg-flex gap-2">
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                    <i class="fas fa-home me-2"></i> Home
                </a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'visualization' %}active{% endif %}" href="{{ url_for('visualization') }}">
                    <i class="fas fa-project-diagram me-2"></i> Simulator
                </a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'simulator' %}active{% endif %}" href="{{ url_for('simulator') }}">
                    <i class="fas fa-table me-2"></i> Truth Table
                </a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'synthesizer' %}active{% endif %}" href="{{ url_for('synthesizer') }}">
                    <i class="fas fa-layer-group me-2"></i> Synthesizer
                </a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'safety_interlock' %}active{% endif %}" href="{{ url_for('safety_interlock') }}">
                    <i class="fas fa-shield-alt me-2"></i> Industrial Twin
                </a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'theory' %}active{% endif %}" href="{{ url_for('theory') }}">
                    <i class="fas fa-book-open me-2"></i> Theory
                </a>
            </nav>

            <!-- Mobile Menu Button -->
            <button class="btn btn-outline-premium d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobileMenu">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- Mobile Menu -->
        <div class="collapse d-lg-none mt-3" id="mobileMenu">
            <div class="d-flex flex-column gap-2 p-3 glass-panel">
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Home</a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'visualization' %}active{% endif %}" href="{{ url_for('visualization') }}">Simulator</a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'simulator' %}active{% endif %}" href="{{ url_for('simulator') }}">Truth Table</a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'synthesizer' %}active{% endif %}" href="{{ url_for('synthesizer') }}">Synthesizer</a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'safety_interlock' %}active{% endif %}" href="{{ url_for('safety_interlock') }}">Industrial Twin</a>
                <a class="nav-link px-3 py-2 {% if request.endpoint == 'theory' %}active{% endif %}" href="{{ url_for('theory') }}">Theory</a>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <main class="container-fluid px-4 pb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global GSAP animations
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.from(".glass-panel", { y: 20, opacity: 0, duration: 0.8, stagger: 0.1, ease: "power2.out" });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
